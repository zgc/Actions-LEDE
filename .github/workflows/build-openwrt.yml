# https://github.com/P3TERX/Actions-OpenWrt
# Description: Build OpenWrt using GitHub Actions (Optimized)
#
# Optimization features:
# - Deterministic upstream commit passed to the canonical build pipeline
# - Download, toolchain, and compiler cache keys scoped to safe inputs
# - Lean runner setup: install prerequisites without upgrading the OS
# - 8GB swap file to prevent OOM during Go/Rust compilations
# - Canonical build.sh handles source preparation, package configuration, and retry policy
#

name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  REPO_COMMIT:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config.seed
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  RELEASE_NAME:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # ← hard limit: 6h max

    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Add 8GB swap file (prevents OOM during Go/Rust builds)"
      run: |
        sudo fallocate -l 8G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        echo "✅ Swap added: $(free -h | grep Swap)"

    - name: Checkout
      uses: actions/checkout@v4
      timeout-minutes: 3

    - name: Load device config
      run: |
        if [ -f openwrt-device.conf ]; then
          RELEASE_NAME=$(sed -n 's/^RELEASE_NAME=\([A-Za-z0-9._-]*\)$/\1/p' openwrt-device.conf | tail -1)
          [ -n "$RELEASE_NAME" ] || { echo "::error::openwrt-device.conf has no valid RELEASE_NAME"; exit 1; }
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          echo "✅ Device: $RELEASE_NAME"
        else
          echo "No openwrt-device.conf found, using default RELEASE_NAME"
        fi
        # Extract DEVICE_ARCH from config.seed for build cache key
        if [ -f config.seed ]; then
          DEVICE_ARCH=$(grep '^CONFIG_TARGET_[a-z0-9_]*=y$' config.seed 2>/dev/null | tail -1 | sed 's/^CONFIG_TARGET_//;s/=y$//')
          echo "DEVICE_ARCH=${DEVICE_ARCH:-x86_64}" >> $GITHUB_ENV
          echo "✅ DEVICE_ARCH: ${DEVICE_ARCH:-x86_64}"
        fi

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      timeout-minutes: 15
      run: |
        sudo -E apt-get update -qq
        sudo -E apt-get install -y --no-install-recommends ack asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache ca-certificates clang cmake cpio curl device-tree-compiler fakeroot flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf gnutls-dev help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev lrzsz msmtp ninja-build nodejs npm patch pkgconf python3 python3-cryptography python3-docutils python3-pip python3-ply python3-pyelftools python3-requests qemu-utils quilt re2c rsync scons sharutils squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get clean
        sudo -E timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$(id -gn)" /workdir
        # ccache config
        mkdir -p ~/.ccache
        echo "max_size = 2.0G" >> ~/.ccache/ccache.conf
        echo "compression = true" >> ~/.ccache/ccache.conf
        echo "compression_level = 6" >> ~/.ccache/ccache.conf

    - name: Clone source code
      working-directory: /workdir
      timeout-minutes: 10
      run: |
        echo -e "PWS -> $PWD"
        df -hT $PWD
        echo -e "GITHUB_WORKSPACE -> $GITHUB_WORKSPACE"
        df -hT $GITHUB_WORKSPACE
        # Keep transport compatibility local to these source operations.
        git -c http.sslVersion=tlsv1.2 -c http.version=HTTP/1.1 \
          clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        if [ -n "$REPO_COMMIT" ]; then
          git -C openwrt -c http.sslVersion=tlsv1.2 -c http.version=HTTP/1.1 \
            fetch --depth 1 origin "$REPO_COMMIT"
          git -C openwrt reset --hard FETCH_HEAD
        fi
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        OPENWRT_COMMIT=$(git -C openwrt rev-parse HEAD)
        echo "commit=$OPENWRT_COMMIT" >> $GITHUB_OUTPUT
        echo "REPO_COMMIT=$OPENWRT_COMMIT" >> $GITHUB_ENV
      id: source_ref

    # ── Granular cache strategy ──────────────────────────────────
    # Cache source downloads broadly: OpenWrt verifies their checksums before use.
    - name: Cache dl/
      id: cache_dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: openwrt-dl-${{ env.DEVICE_ARCH }}-${{ hashFiles('feeds.conf.default', 'diy-part1.sh') }}
        restore-keys: |
          openwrt-dl-${{ env.DEVICE_ARCH }}-

    # Toolchain/staging outputs are only reusable for an identical upstream and
    # build input set; restoring them across commits risks stale ABI artifacts.
    - name: Cache toolchain
      id: cache_toolchain
      uses: actions/cache@v4
      with:
        path: |
          openwrt/staging_dir
          openwrt/build_dir/target-*
          openwrt/build_dir/host
          openwrt/build_dir/hostpkg
        key: openwrt-toolchain-${{ env.DEVICE_ARCH }}-${{ steps.source_ref.outputs.commit }}-${{ hashFiles('config.seed', 'feeds.conf.default', 'diy-part1.sh', 'diy-part2.sh', 'build.sh', 'scripts/build/**', 'scripts/verify_firmware.sh', 'openwrt-device.conf') }}

    # Cache 3: ccache (compiler cache)
    - name: Cache ccache
      id: cache_ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: openwrt-ccache-${{ env.DEVICE_ARCH }}-${{ hashFiles('config.seed', 'feeds.conf.default', 'diy-part1.sh', 'diy-part2.sh', 'build.sh', 'scripts/build/**', 'openwrt-device.conf') }}
        restore-keys: |
          openwrt-ccache-${{ env.DEVICE_ARCH }}-

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Build firmware with canonical pipeline
      id: compile
      timeout-minutes: 300
      run: |
        ./build.sh
        echo "status=success" >> $GITHUB_OUTPUT

        [ -z "$RELEASE_NAME" ] && RELEASE_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' config.seed | sed -r 's/CONFIG_TARGET_(.*)_DEVICE.*=y/\1/')
        echo "$RELEASE_NAME" > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload build failure log
      uses: actions/upload-artifact@v4
      if: failure() && hashFiles('build-failure.log') != ''
      with:
        name: OpenWrt_build_failure_${{ env.RELEASE_NAME }}
        path: build-failure.log
        if-no-files-found: error

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Publish canonical release directory
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -euo pipefail
        release_dir="$GITHUB_WORKSPACE/release"
        for file in \
          config.buildinfo \
          "${DEVICE_NAME}.target.config.buildinfo" \
          "${DEVICE_NAME}.manifest" \
          "${DEVICE_NAME}.img.gz" \
          "${DEVICE_NAME}.img.gz.md5" \
          "${DEVICE_NAME}.img.md5"; do
          test -s "$release_dir/$file" || { echo "::error::canonical build output is missing: $file"; exit 1; }
        done
        gzip -t "$release_dir/${DEVICE_NAME}.img.gz"
        echo "FIRMWARE=$GITHUB_WORKSPACE/release" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ $UPLOAD_COWTRANSFER = true ] && echo "🔗 [Cowtransfer](${{ steps.cowtransfer.outputs.url }})" >> release.txt
        [ $UPLOAD_WETRANSFER = true ] && echo "🔗 [WeTransfer](${{ steps.wetransfer.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
