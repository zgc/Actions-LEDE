name: Merge-upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

env:
  UPSTREAM_REPO: https://github.com/P3TERX/Actions-OpenWrt
  UPSTREAM_BRANCH: main

concurrency:
  group: firmware-lifecycle-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        lfs: true
        token: ${{ secrets.SEC_TOKEN || github.token }}

    - name: Set git identity
      run : |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Check upstream
      id: upstream
      run:  |
        git remote remove upstream >/dev/null 2>&1 || true
        git remote add upstream "$UPSTREAM_REPO"
        git fetch --force upstream
        if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
          echo "changed=false"
          echo "✅ upstream already up to date"
        else
          echo "changed=true"
        fi

    - name: Rebase upstream commits
      if: steps.upstream.outputs.changed == 'true'
      run: git rebase "upstream/$UPSTREAM_BRANCH"

    - name: Push Commits
      if: steps.upstream.outputs.changed == 'true'
      env:
        DOWNSTREAM_BRANCH: main
      run: git push --force-with-lease origin $DOWNSTREAM_BRANCH
