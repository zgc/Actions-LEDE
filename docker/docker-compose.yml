name: openwrt-build

services:
  builder:
    image: actions-lede-builder:latest
    container_name: openwrt-builder
    volumes:
      - ..:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash

  # Manual run: docker compose up clean (use before first build or after path changes)
  clean:
    image: actions-lede-builder:latest
    container_name: openwrt-clean
    volumes:
      - ..:/workspace
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        echo "=== Cleaning stale toolchain artifacts ==="
        rm -rf /workspace/openwrt/build_dir/toolchain*
        rm -rf /workspace/openwrt/staging_dir/toolchain*
        rm -f /workspace/openwrt/build_dir/target-*/root.squashfs
        rm -rf /workspace/openwrt/build_dir/target-*/target-dir-*
        echo "=== Cleanup done ==="
    restart: "no"

  build:
    image: actions-lede-builder:latest
    container_name: openwrt-build
    volumes:
      - ..:/workspace
    working_dir: /workspace
    mem_limit: 24g
    command:
      - bash
      - -c
      - bash build.sh
    restart: "no"
